<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Blue</title>
    <!-- Tailwind CSS para um design moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-slate-100 min-h-screen font-sans text-gray-800 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-blue-100">
        <div class="text-center mb-6">
            <span class="inline-block bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-2">Linha Profissional</span>
            <h1 class="text-2xl md:text-3xl font-extrabold text-blue-900">Calculadora Blue</h1>
            <p class="text-sm text-gray-500 mt-1">Otimize suas diluições e custos com precisão</p>
        </div>
        
        <!-- Tamanho da Embalagem -->
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Tamanho da Embalagem</label>
            <select id="packageSize" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                <option value="1000">1 Litro (1.000 ml)</option>
                <option value="5000" selected>5 Litros (5.000 ml)</option>
            </select>
        </div>

        <!-- Valor do Produto -->
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Valor do Produto (R$)</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500 font-medium">R$</span>
                <input type="number" id="productPrice" placeholder="Ex: 129,89" class="w-full pl-10 p-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white transition" step="0.01">
            </div>
        </div>

        <!-- Nível de Sujidade -->
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Nível de Sujidade (Diluição)</label>
            <select id="dirtLevel" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                <option value="10">Baixa (1:100 - 10 ml/L)</option>
                <option value="20">Intermediária (1:50 - 20 ml/L)</option>
                <option value="50">Média (1:20 - 50 ml/L)</option>
                <option value="100">Alta (1:10 - 100 ml/L)</option>
            </select>
        </div>

        <!-- Volume Desejado da Solução -->
        <div class="mb-6">
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Volume de Solução Desejado (Litros)</label>
            <input type="number" id="solutionVolume" placeholder="Ex: 10" class="w-full pl-3 p-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white transition" step="0.1">
        </div>

        <button onclick="calculate()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3.5 rounded-xl shadow-lg shadow-blue-500/30 transition transform active:scale-95">
            Calcular
        </button>

        <!-- Custom Message Box (Alternative to alert) -->
        <div id="customAlert" class="hidden mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-xl text-sm flex items-center justify-between">
            <span id="alertMessage">Preencha todos os campos corretamente.</span>
            <button onclick="closeAlert()" class="font-bold text-red-900 ml-2">&times;</button>
        </div>

        <!-- Resultados -->
        <div id="results" class="hidden mt-6 p-5 bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-200 rounded-2xl shadow-inner">
            <h2 class="font-bold text-blue-900 text-base mb-3 border-b border-blue-200 pb-2">Resultado da Mistura:</h2>
            <div class="space-y-2 text-sm">
                <p id="resPure" class="flex justify-between"><span class="text-gray-600">Produto Puro Necessário:</span> <span class="font-semibold text-gray-900"></span></p>
                <p id="resWater" class="flex justify-between"><span class="text-gray-600">Água Necessária:</span> <span class="font-semibold text-gray-900"></span></p>
                <p id="resCost" class="flex justify-between"><span class="text-gray-600">Custo por Litro da Solução:</span> <span class="font-semibold text-blue-700"></span></p>
            </div>
            <div id="resYield" class="mt-4 pt-3 border-t border-blue-200 text-xs font-bold text-blue-900 uppercase tracking-wide text-center bg-white/80 p-2.5 rounded-xl"></div>
        </div>
    </div>

    <script>
        function showAlert(msg) {
            document.getElementById('alertMessage').innerText = msg;
            document.getElementById('customAlert').classList.remove('hidden');
        }

        function closeAlert() {
            document.getElementById('customAlert').classList.add('hidden');
        }

        function calculate() {
            closeAlert();
            const packageSize = parseFloat(document.getElementById('packageSize').value);
            const price = parseFloat(document.getElementById('productPrice').value);
            const mlPerLiter = parseFloat(document.getElementById('dirtLevel').value);
            const desiredVolume = parseFloat(document.getElementById('solutionVolume').value);

            if (isNaN(price) || isNaN(desiredVolume) || price <= 0 || desiredVolume <= 0) {
                showAlert('Por favor, informe valores válidos para o preço e volume desejado.');
                return;
            }

            // Cálculos para o lote desejado
            const pureNeededMl = desiredVolume * mlPerLiter;
            const waterNeededMl = (desiredVolume * 1000) - pureNeededMl;
            
            const waterLiters = Math.floor(waterNeededMl / 1000);
            const waterMl = Math.round(waterNeededMl % 1000);

            // Formatação detalhada amigável da água em litros e mililitros
            let waterText = '';
            if (waterLiters > 0 && waterMl > 0) {
                waterText = `${waterLiters} litro${waterLiters > 1 ? 's' : ''} e ${waterMl} ml`;
            } else if (waterLiters > 0) {
                waterText = `${waterLiters} litro${waterLiters > 1 ? 's' : ''}`;
            } else {
                waterText = `${waterMl} ml`;
            }

            // Custo financeiro
            const pricePerMl = price / packageSize;
            const batchCost = pureNeededMl * pricePerMl;
            const costPerLiter = batchCost / desiredVolume;

            // Formatação rigorosa no padrão monetário brasileiro R$ 0,00
            const formattedCost = costPerLiter.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            // Rendimento total da embalagem selecionada
            const totalYieldL = packageSize / mlPerLiter;

            // Exibição dos resultados
            document.querySelector('#resPure span:last-child').innerText = `${pureNeededMl.toFixed(0)} ml`;
            document.querySelector('#resWater span:last-child').innerText = waterText;
            document.querySelector('#resCost span:last-child').innerText = formattedCost;
            document.getElementById('resYield').innerText = `Rendimento Total da Embalagem: Até ${totalYieldL.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ".")} litros`;

            document.getElementById('results').classList.remove('hidden');
        }
    </script>
</body>
</html>
